name: Week 3 Lab - Integrate MCP with GitHub Copilot
description: Hands-on MCP lab for Week 3 covering GitHub MCP server setup, Agent Mode tool use, and end-to-end feature implementation
title: "Week 3 Lab: Integrate MCP with GitHub Copilot - <Your Name>"
labels: ["lab", "week-3"]
body:
  - type: markdown
    attributes:
      value: |
        ## Goal
        Connect the GitHub MCP server to Copilot Agent Mode, use it to research and create issues, implement a feature end-to-end (branch, code, pull request), and close the loop with a Copilot-generated comment on the resolved issue.

  - type: checkboxes
    id: tasks
    attributes:
      label: Tasks
      options:
        - label: Read `Workshops/Week3/1-MCP-Foundations.md`
        - label: Read `Workshops/Week3/2-MCP-in-Production.md`
        - label: Complete the hands-on lab in `Workshops/Week3/3-Week3-Lab.md`
        - label: Review prompt examples in `Workshops/Week3/4-Week3-Prompts.md`
    validations:
      required: true

  - type: dropdown
    id: ide_used
    attributes:
      label: Which IDE did you use?
      options:
        - VS Code
        - Visual Studio
        - JetBrains (IntelliJ, PyCharm, etc.)
        - GitHub Codespaces
        - Xcode
        - Neovim/Vim
        - Eclipse
        - Other
    validations:
      required: true

  - type: checkboxes
    id: modes_practiced
    attributes:
      label: Which Copilot interaction modes did you practise?
      options:
        - label: Inline suggestions (code completions as you type)
        - label: Ask Mode (Copilot Chat for questions/explanations)
        - label: Inline chat or targeted edits (focused code modifications)
        - label: Agent Mode (autonomous multi-file changes)
        - label: Plan agent (generating implementation plans before editing)

  - type: checkboxes
    id: mcp_topics
    attributes:
      label: Which MCP topics did you explore?
      options:
        - label: MCP specification fundamentals (JSON-RPC, primitives, transports)
        - label: Configuring .vscode/mcp.json with the remote GitHub MCP server
        - label: Configuring .vscode/mcp.json with a local stdio server (Docker or npx)
        - label: Using the trust prompt and understanding when it appears
        - label: Viewing and toggling tools in the Agent Mode tool picker
        - label: Auto-discovery of MCP servers from other applications
        - label: Toolsets configuration (default, optional, or remote-only toolsets)
        - label: Read-only mode for the GitHub MCP server
        - label: Configuring MCP for the Copilot coding agent (mcpServers JSON format)
        - label: Configuring MCP servers in the Copilot CLI (~/.copilot/mcp-config.json)
        - label: Using /mcp slash commands in the Copilot CLI
        - label: Reviewing the MCP output log for audit and troubleshooting

  - type: checkboxes
    id: copilot_surface
    attributes:
      label: Which Copilot surface did you use MCP with?
      options:
        - label: VS Code Agent Mode
        - label: Copilot CLI (gh copilot or standalone copilot binary)
        - label: Copilot coding agent (repository cloud agent)
        - label: GitHub MCP server (remote, https://api.githubcopilot.com/mcp/)
        - label: GitHub MCP server (local, Docker or binary)
        - label: Playwright MCP server
        - label: Filesystem MCP server
        - label: Fetch MCP server
        - label: Another community or custom MCP server

  - type: checkboxes
    id: activities
    attributes:
      label: What activities did you complete in the lab?
      options:
        - label: "Configure the GitHub MCP server - Add .vscode/mcp.json with the remote GitHub MCP server URL, authenticate via OAuth, and verify the server tools appear in Agent Mode."
        - label: "Research and create issues with Copilot - Use Agent Mode and GitHub MCP tools to search for similar projects, compare features, and create enhancement issues in the repository."
        - label: "Implement an issue end-to-end - Ask Copilot to select an important issue, check out a branch, implement the changes, push, and open a pull request."
        - label: "Review, merge, and close the loop - Review the AI-generated pull request, merge it, and use Copilot to post a closing comment on the resolved issue."

  - type: textarea
    id: prompt_log
    attributes:
      label: Best prompt you used (paste it here)
      description: Share a prompt or comment that worked particularly well for MCP-powered workflows
      placeholder: |
        Example: "List all open issues in this repository, rank them by impact, then implement the top priority issue end-to-end including branch, code changes, and a pull request."
    validations:
      required: true

  - type: textarea
    id: code_example
    attributes:
      label: Code or configuration Copilot generated for you
      description: Paste an example of code or configuration that Copilot generated well (e.g., mcp.json, a feature implementation, a test)
      placeholder: |
        // Paste your example here

  - type: dropdown
    id: time_impact
    attributes:
      label: Time impact compared to coding without Copilot
      options:
        - "Much faster - saved significant time"
        - "Somewhat faster - saved some time"
        - "About the same"
        - "Slower - still learning how to use it effectively"
    validations:
      required: true

  - type: textarea
    id: worked
    attributes:
      label: What worked well?
      placeholder: "What did Copilot do well with MCP? Which tool invocations were most impressive?"
    validations:
      required: true

  - type: textarea
    id: challenges
    attributes:
      label: What was challenging?
      placeholder: "What didn't work as expected? Any setup issues, trust prompt confusion, or unexpected tool behaviour?"
    validations:
      required: true

  - type: dropdown
    id: confidence
    attributes:
      label: How confident do you feel using Copilot after Week 3?
      options:
        - "Very confident - ready to use it daily"
        - "Fairly confident - understand the basics"
        - "Somewhat confident - need more practice"
        - "Not very confident - still figuring it out"
    validations:
      required: true

  - type: textarea
    id: pr_link
    attributes:
      label: PR link (if applicable)
      placeholder: "Paste the PR URL here"

  - type: textarea
    id: questions
    attributes:
      label: Questions for next week
      description: Any questions or topics you'd like to explore further?
      placeholder: "What would you like to learn more about?"
